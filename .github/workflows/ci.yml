name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -short skips the slow kmeans fits (~5 min under -race).
      - run: go test -race -short ./...
      - run: go test -run '^$' -fuzz FuzzDecodeCentroids -fuzztime 20s .
